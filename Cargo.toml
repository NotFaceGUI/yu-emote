[package]
name = "yu-emote"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "E-mote (PSB/EMT) data layer and YU-RIS adapter built with reference to eluna: parse, animate, render"
repository = "https://github.com/NotFaceGUI/yu-emote"
readme = "README.md"
keywords = ["e-mote", "psb", "emt", "yu-ris", "wgpu"]
categories = ["parser-implementations", "game-development", "encoding"]

[lib]
name = "yu_emote"
path = "src/lib.rs"

[dependencies]
emote-psb = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.17"
smol_str = "0.3.6"
thiserror = "2"

[[bin]]
name = "psb-info"
path = "src/bin/psb-info.rs"

[profile.release]
lto = "thin"

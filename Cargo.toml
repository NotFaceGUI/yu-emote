[package]
name = "yu-emote"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "E-mote (PSB/EMT) runtime and YU-RIS adapter built on the vendored eluna runtime"
repository = "https://github.com/NotFaceGUI/yu-emote"
readme = "README.md"
keywords = ["e-mote", "psb", "emt", "yu-ris", "wgpu"]
categories = ["parser-implementations", "game-development", "encoding"]

[lib]
name = "yu_emote"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
eluna = { package = "eluna_rs", path = "vendor/eluna" }
png = "0.17"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wgpu = "30.0.1"

[[bin]]
name = "psb-info"
path = "src/bin/psb-info.rs"

[[bin]]
name = "psb-dump"
path = "src/bin/psb-dump.rs"

[[bin]]
name = "psb-key-search"
path = "src/bin/psb-key-search.rs"

[[bin]]
name = "psb-render"
path = "src/bin/psb-render.rs"

[[bin]]
name = "psb-anim"
path = "src/bin/psb-anim.rs"

[[bin]]
name = "psb-bench"
path = "src/bin/psb-bench.rs"

[[bin]]
name = "psb-gpu"
path = "src/bin/psb-gpu.rs"

[profile.release]
lto = "thin"
